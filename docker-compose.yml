version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: mein-postgres
    restart: always
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: player
    ports:
      - "9994:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
